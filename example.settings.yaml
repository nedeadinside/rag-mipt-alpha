ingestion:
  collection_name: alfa_websites
  qdrant_path: .qdrant
  websites_csv_path: data/websites.csv
  upsert_batch_size: 64

chunking:
  chunk_size: 512
  threshold: 0.8
  embedding_model: minishlab/potion-base-32M
  overlap_size: 0.25
  overlap_method: justified

embedding:
  dense_model: intfloat/multilingual-e5-large
  sparse_model: Qdrant/bm42-all-minilm-l6-v2-attentions
  cache_dir: .fastembed

retrieval:
  prefetch_limit: 50
  reranker_model: BAAI/bge-reranker-v2-m3
  reranker_device: cpu
