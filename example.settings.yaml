ingestion:
  collection_name: alfa_websites
  qdrant_path: .qdrant
  websites_csv_path: data/websites.csv
  upsert_batch_size: 64

chunking:
  chunk_size: 496
  threshold: 0.5
  embedding_model: minishlab/potion-base-32M
  min_sentences_per_chunk: 4
  min_characters_per_sentence: 80
  skip_window: 1
  filter_tolerance: 0.05
  overlap_size: 0.25
  overlap_method: prefix

embedding:
  dense_model: intfloat/multilingual-e5-large
  sparse_model: Qdrant/bm42-all-minilm-l6-v2-attentions
  cache_dir: .fastembed
  use_cuda: false

retrieval:
  prefetch_limit: 100
  reranker_model: BAAI/bge-reranker-v2-m3
  reranker_device: cpu

llm:
  model_name: gemma4:31b-cloud
  base_url: http://localhost:11434
  temperature: 1.0
  top_p: 0.95
  top_k: 64

rag:
  top_k: 50
  top_kr: 10
  strategy: multiquery
  prompt_name: qa_rag
  verifier_prompt_name: verifier
  refusal_text_name: refusal_text
