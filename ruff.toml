line-length = 100
target-version = "py313"
src = ["src", "scripts", "cmd"]
extend-exclude = [".venv", "data", ".qdrant"]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "TID",
    "PL",
]
ignore = [
    "PLR0913",
    "E501",
]

[lint.isort]
known-first-party = ["src", "cmd"]

[format]
quote-style = "double"
indent-style = "space"
